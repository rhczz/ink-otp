name: InkOTPDesktopUI
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  InkOTPDesktopUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - DesktopUpgradeTests.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rhczz.inkotp.macos.ui-tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  InkOTPDesktopUI:
    build:
      targets:
        InkOTPDesktopUITests: [test]
    test:
      targets:
        - name: InkOTPDesktopUITests
          parallelizable: false
      environmentVariables:
        INKOTP_UI_STAGED_APP: "${INKOTP_UI_STAGED_APP}"
