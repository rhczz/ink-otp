{
  "schema_version": 1,
  "package_id": "io.github.rhczz.inkotp",
  "modules": {
    "core": {
      "junit": "android/core/build/test-results/test",
      "minimum_tests": 105,
      "coverage": "android/core/build/reports/jacoco/test/jacocoTestReport.xml",
      "minimum_coverage": {"LINE": 90, "BRANCH": 70}
    },
    "app": {
      "junit": "android/app/build/test-results/testDebugUnitTest",
      "minimum_tests": 128,
      "coverage": "android/app/build/reports/jacoco/jacocoDebugReport/jacocoDebugReport.xml",
      "minimum_coverage": {"LINE": 75, "BRANCH": 45}
    }
  },
  "lint": [
    "android/app/build/reports/lint-results-debug.xml",
    "android/app/build/reports/lint-results-release.xml"
  ],
  "manifests": [
    "android/app/src/main/AndroidManifest.xml",
    "android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
  ],
  "allowed_permissions": [
    "android.permission.CAMERA",
    "android.permission.HIDE_OVERLAY_WINDOWS",
    "android.permission.USE_BIOMETRIC",
    "android.permission.USE_FINGERPRINT",
    "io.github.rhczz.inkotp.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
  ],
  "apk": {
    "path": "android/app/build/outputs/apk/release/app-release-unsigned.apk",
    "metadata": "android/app/build/outputs/apk/release/output-metadata.json",
    "max_bytes": 15728640,
    "required_abis": ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
  }
}
