name: iOS Release

on:
  push:
    tags: ['ios-v*']

permissions:
  contents: read

concurrency:
  group: inkotp-ios-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned release from master
        env:
          IOS_TAG: ${{ github.ref_name }}
          IOS_RELEASE_SIGNED: ${{ vars.INKOTP_IOS_RELEASE_SIGNED }}
        run: |
          [[ "$IOS_TAG" =~ ^ios-v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/master
          project_version=$(awk '/MARKETING_VERSION:/ {gsub(/"/,"",$2); print $2}' ios/project.yml)
          [[ "$IOS_TAG" == "ios-v$project_version" || "$IOS_TAG" == "ios-v$project_version"-preview.* ]]
          if [[ "$IOS_TAG" != *-preview.* && "$IOS_RELEASE_SIGNED" != true ]]; then
            echo '::error::A stable release requires the signed IPA job and Apple provisioning.'
            exit 1
          fi

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  sign:
    if: vars.INKOTP_IOS_RELEASE_SIGNED == 'true'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: bash ios/Scripts/select-xcode.sh
      - name: Generate project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Archive and export an Apple-signed IPA
        env:
          INKOTP_IOS_CERTIFICATE_BASE64: ${{ secrets.INKOTP_IOS_CERTIFICATE_BASE64 }}
          INKOTP_IOS_CERTIFICATE_PASSWORD: ${{ secrets.INKOTP_IOS_CERTIFICATE_PASSWORD }}
          INKOTP_IOS_PROFILE_BASE64: ${{ secrets.INKOTP_IOS_PROFILE_BASE64 }}
        run: bash ios/Scripts/sign-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-ipa
          path: ios/build/signed/InkOTP-iOS.ipa
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    needs: [verify, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inkotp-ios-simulator
          path: distribution
      - if: needs.sign.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inkotp-ios-ipa
          path: distribution
      - name: Publish verified iOS release files
        working-directory: distribution
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --latest=false --title "InkOTP iOS ${IOS_TAG#ios-v}")
          if [[ "$IOS_TAG" == *-preview.* ]]; then
            args+=(--prerelease)
          else
            test -f InkOTP-iOS.ipa
          fi
          assets=(InkOTP-iOS-Simulator.zip)
          if [[ -f InkOTP-iOS.ipa ]]; then
            assets+=(InkOTP-iOS.ipa)
            printf '%s\n' 'The IPA is Apple-signed for the devices registered in the Ad Hoc provisioning profile.' > release.md
          else
            printf '%s\n' 'Simulator preview. It runs in Xcode Simulator and has no iPhone or iPad installer.' > release.md
          fi
          printf '\nCross-platform contract checks and XCTest passed in [GitHub Actions](%s/%s/actions/runs/%s).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release.md
          sha256sum "${assets[@]}" > SHA256SUMS-iOS
          gh release create "$IOS_TAG" "${assets[@]}" SHA256SUMS-iOS --repo "$GITHUB_REPOSITORY" "${args[@]}" --notes-file release.md
