name: iOS signing

on:
  workflow_call:
    inputs:
      release-version:
        description: Full version from the shared release tag
        required: true
        type: string
    secrets:
      INKOTP_IOS_CERTIFICATE_BASE64:
        required: true
      INKOTP_IOS_CERTIFICATE_PASSWORD:
        required: true
      INKOTP_IOS_PROFILE_BASE64:
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      INKOTP_RELEASE_VERSION: ${{ inputs.release-version }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the shared release tag
        run: test "$GITHUB_REF" = "refs/tags/v$INKOTP_RELEASE_VERSION"
      - name: Select Xcode
        run: bash ios/Scripts/select-xcode.sh
      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Archive and export an Apple-signed IPA
        env:
          INKOTP_IOS_CERTIFICATE_BASE64: ${{ secrets.INKOTP_IOS_CERTIFICATE_BASE64 }}
          INKOTP_IOS_CERTIFICATE_PASSWORD: ${{ secrets.INKOTP_IOS_CERTIFICATE_PASSWORD }}
          INKOTP_IOS_PROFILE_BASE64: ${{ secrets.INKOTP_IOS_PROFILE_BASE64 }}
        run: bash ios/Scripts/sign-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-ipa
          path: ios/build/signed/InkOTP-iOS.ipa
          if-no-files-found: error
