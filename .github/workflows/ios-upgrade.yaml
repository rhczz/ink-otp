name: iOS upgrade verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: bash ios/Scripts/select-xcode.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inkotp-ios-simulator
          path: ios/build/upgrade-input
      - name: Generate the iOS project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Verify in-place upgrade from the published iOS preview
        run: bash ios/Scripts/verify-simulator-upgrade.sh ios/build/upgrade-input/InkOTP-iOS-Simulator.zip
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-upgrade-evidence
          path: ios/build/upgrade-reports/
          if-no-files-found: warn
