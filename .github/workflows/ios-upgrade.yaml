name: iOS upgrade verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode
        run: bash ios/Scripts/select-xcode.sh
      - name: Generate the iOS project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Build and package the Release simulator app
        run: |
          xcodebuild -project ios/InkOTP.xcodeproj -scheme InkOTP -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build/DerivedData \
            ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' CODE_SIGN_IDENTITY=- build
          build_app=ios/build/DerivedData/Build/Products/Release-iphonesimulator/InkOTP.app
          test -f "$build_app/PrivacyInfo.xcprivacy"
          lipo "$build_app/InkOTP" -verify_arch arm64 x86_64
          codesign --verify --strict "$build_app"
          mkdir -p ios/build/packages
          ditto -c -k --keepParent "$build_app" ios/build/packages/InkOTP-iOS-Simulator.zip
      - name: Verify in-place upgrade from the published iOS preview
        run: bash ios/Scripts/verify-simulator-upgrade.sh ios/build/packages/InkOTP-iOS-Simulator.zip
      - name: Preserve verified simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-simulator
          path: ios/build/packages/InkOTP-iOS-Simulator.zip
          if-no-files-found: error
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-upgrade-evidence
          path: ios/build/upgrade-reports/
          if-no-files-found: warn
