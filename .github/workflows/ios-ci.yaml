name: iOS verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: bash ios/Scripts/select-xcode.sh
      - name: Verify offline crypto source fingerprints
        run: shasum -a 256 -c ios/Core/Sources/CInkKDF/SHA256SUMS
      - name: Run the public contract suite
        run: swift test --package-path ios/Core --enable-code-coverage
      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Archive Release for iPhone and iPad
        run: bash ios/Scripts/package-device.sh
      - name: Verify device package after extraction
        run: bash ios/Scripts/verify-device.sh ios/build/packages/InkOTP-iOS-unsigned.ipa
      - name: Preserve verified unsigned device IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-device-unsigned
          path: ios/build/packages/InkOTP-iOS-unsigned.ipa
          if-no-files-found: error
      - name: Verify iOS application and UI with XCTest
        id: simulator
        run: |
          simulator=$(python3 ios/Scripts/select-simulator.py)
          mkdir -p ios/build/reports
          xcodebuild -project ios/InkOTP.xcodeproj -scheme InkOTP \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath ios/build/DerivedData -resultBundlePath ios/build/results.xcresult \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- test
      - name: Export line coverage and result summary
        if: always()
        run: |
          mkdir -p ios/build/reports
          if [[ -d ios/build/results.xcresult ]]; then
            if ! xcrun xcresulttool get test-results summary --path ios/build/results.xcresult > ios/build/reports/simulator-tests.json; then
              rm -f ios/build/reports/simulator-tests.json
              [[ "${{ steps.simulator.outcome }}" != success ]] || exit 1
            fi
            if ! xcrun xccov view --report --json ios/build/results.xcresult > ios/build/reports/simulator-line-coverage.json; then
              rm -f ios/build/reports/simulator-line-coverage.json
              [[ "${{ steps.simulator.outcome }}" != success ]] || exit 1
            fi
          fi
          core_binary=$(find ios/Core/.build -type f -path '*/InkOTPCorePackageTests.xctest/Contents/MacOS/InkOTPCorePackageTests' -print -quit)
          core_profile=$(find ios/Core/.build -name default.profdata -type f -print -quit)
          if [[ -n "$core_binary" && -n "$core_profile" ]]; then
            xcrun llvm-cov report "$core_binary" -instr-profile="$core_profile" -ignore-filename-regex='(/Tests/|PackageTests[.]derived/)' > ios/build/reports/core-coverage.txt
            cat ios/build/reports/core-coverage.txt
          fi
      - name: Summarize and check simulator evidence
        working-directory: ios/build/reports
        run: |
          jq -e '.totalTestCount > 0 and .passedTests == .totalTestCount and .result == "Passed"' simulator-tests.json >/dev/null
          {
            jq -r '.devicesAndConfigurations[] | "\(.device.deviceName) · iOS \(.device.osVersion) · \(.passedTests) tests passed"' simulator-tests.json
            jq -er '.targets[] | select(.name == "InkOTP.app" and .executableLines > 0) | "App line coverage: \(.coveredLines)/\(.executableLines) (\(.lineCoverage * 10000 | round / 100)%)"' simulator-line-coverage.json
            awk '$1 == "TOTAL" {print "Core line coverage: " $10; print "Core branch coverage: " $13; found=1} END {if (!found) exit 1}' core-coverage.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build and package the Release simulator app
        run: |
          xcodebuild -project ios/InkOTP.xcodeproj -scheme InkOTP -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build/DerivedData \
            ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' CODE_SIGN_IDENTITY=- build
          build_app=ios/build/DerivedData/Build/Products/Release-iphonesimulator/InkOTP.app
          test -f "$build_app/PrivacyInfo.xcprivacy"
          lipo "$build_app/InkOTP" -verify_arch arm64 x86_64
          codesign --verify --strict "$build_app"
          mkdir -p ios/build/packages
          ditto -c -k --keepParent "$build_app" ios/build/packages/InkOTP-iOS-Simulator.zip
      - name: Preserve verified simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-simulator
          path: ios/build/packages/InkOTP-iOS-Simulator.zip
          if-no-files-found: error
      - name: Preserve generated public contract exports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-swift-contract-files
          path: ios/Core/.contract-exports/
          if-no-files-found: error
          include-hidden-files: true
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inkotp-ios-verification-reports
          path: |
            ios/build/reports/
            ios/build/results.xcresult/
          if-no-files-found: warn
