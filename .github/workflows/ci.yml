name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle tests, build and lint
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python reference implementation
        run: |
          python3 -m venv tools/.venv
          tools/.venv/bin/pip install -q -r tools/requirements.txt
          tools/.venv/bin/python tools/reference_totp.py --selftest
          tools/.venv/bin/python tools/reference_backup.py --selftest

      - name: Security gates (no network permissions, no design-token drift)
        run: |
          tools/.venv/bin/python tools/check_no_internet.py \
            --manifest android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          tools/.venv/bin/python tools/check_design_tokens.py \
            --root android/app/src/main/kotlin
