name: InkOTP
options:
  bundleIdPrefix: io.github.rhczz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
packages:
  InkOTPCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.4"
    CURRENT_PROJECT_VERSION: "3"
    INKOTP_RELEASE_VERSION: "$(MARKETING_VERSION)"
targets:
  InkOTP:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rhczz.inkotp
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: InkOTPCore
  InkOTPTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InkOTP
      - package: InkOTPCore
  InkOTPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InkOTP
  InkOTPUpgradeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UpgradeUITests, UITests/InkOTPFlowTests.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InkOTP
schemes:
  InkOTP:
    build:
      targets:
        InkOTP: all
    test:
      gatherCoverageData: true
      targets:
        - InkOTPTests
        - InkOTPUITests
  InkOTPUpgrade:
    build:
      targets:
        InkOTP: [test]
    test:
      targets:
        - InkOTPUpgradeUITests
